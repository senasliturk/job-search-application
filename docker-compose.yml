# Local-development orchestration. Each service has its own Dockerfile
# and is deployed SEPARATELY in production (Azure App Service / Container Apps).
# This compose file just makes it easy to run the whole system on a laptop.

services:
  # ---------- Infrastructure ----------
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SQL Server for local dev (in production use Azure SQL).
  # NOTE: `platform: linux/amd64` is needed on Apple Silicon (M1/M2/M3) Macs —
  # the image isn't published for arm64. It runs under Rosetta; slow on cold
  # start but works fine for dev. On x86 the line is a no-op.
  db:
    image: mcr.microsoft.com/azure-sql-edge:latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "1"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Your_password123' -Q 'SELECT 1' || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- App services ----------
  # All backends mount ./secrets read-only so they can read
  # firebase-sa.json when Firebase Auth is configured. The folder is
  # git-ignored. If the file is absent the services fall back to dev-mode
  # auth (anyone is treated as "dev-user").
  job-posting-service:
    build: ./services/job-posting-service
    env_file: .env
    volumes:
      - ./secrets:/run/secrets:ro
      - cv_uploads:/app/uploads
    ports: ["8001:8001"]
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      db: { condition: service_started }

  job-search-service:
    build: ./services/job-search-service
    env_file: .env
    volumes:
      - ./secrets:/run/secrets:ro
    ports: ["8002:8002"]
    depends_on:
      redis: { condition: service_healthy }

  notification-service:
    build: ./services/notification-service
    env_file: .env
    volumes:
      - ./secrets:/run/secrets:ro
    ports: ["8003:8003"]
    depends_on:
      rabbitmq: { condition: service_healthy }

  ai-agent-service:
    build: ./services/ai-agent-service
    env_file: .env
    ports: ["8004:8004"]
    depends_on:
      - job-posting-service
      - job-search-service

  api-gateway:
    build: ./services/api-gateway
    env_file: .env
    volumes:
      - ./secrets:/run/secrets:ro
    ports: ["8000:8000"]
    depends_on:
      - job-posting-service
      - job-search-service
      - notification-service
      - ai-agent-service

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* must be available at BUILD time for Next.js to inline
      # them into the client bundle. docker-compose substitutes ${VAR} from
      # the root .env file (NOT env_file, which is runtime-only).
      args:
        NEXT_PUBLIC_API_GATEWAY_URL: ${NEXT_PUBLIC_API_GATEWAY_URL}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
    env_file: .env
    ports: ["3000:3000"]
    depends_on:
      - api-gateway

volumes:
  cv_uploads:
